{% load conjugation_tags %}{% load user_agents %}
<button id="translationMobileShowButton" type="button" class="btn btn-light d-flex text-body bg-white border-0 pb-0 pt-0 pl-0 pr-0"
data-toggle="collapse" style="width: 100%"
        data-target="#translationMobileContent" aria-expanded="false"
        aria-controls="translationMobileContent"><span class="h5 mb-0"><span><i
        style="align-self: center" id="translationMobileShowButtonArrow"
        class="fa fa-chevron-right"></i></span>&nbsp;<span>Показать перевод</span></span>
</button>

<div id="translationMobileContent" class="collapse" aria-expanded="false">
    <div class="dictionnaire" data-verb="{{ v.infinitive }}" data-api-base="https://coverbe.web.app/api/"></div>
</div>
<script>
    let $content = $('#translationMobileContent');
    $content.on('show.bs.collapse hide.bs.collapse', function () {
        $('#translationMobileShowButtonArrow').toggleClass('fa-chevron-right').toggleClass('fa-chevron-down')
    });
    $content.on('shown.bs.collapse', function () {
        if (window.updateExamplesWraps) window.updateExamplesWraps();
    });
    $content.on('hidden.bs.collapse', function () {
        const btn = document.getElementById('translationMobileShowButton');
        if (btn) {
            const yOffset = -100; // Increased offset for sticky header
            const y = btn.getBoundingClientRect().top + window.pageYOffset + yOffset;
            window.scrollTo({top: y, behavior: 'auto'});
        }
    });

    document.addEventListener('DOMContentLoaded', function () {
        var btn = document.getElementById('translationMobileShowButton');
        if (!btn || !window.IntersectionObserver) return;

        var sentinel = document.createElement('div');
        sentinel.style.height = '1px';
        sentinel.style.marginBottom = '-1px'; // Prevent layout shift
        sentinel.style.visibility = 'hidden';
        sentinel.style.pointerEvents = 'none';

        if (btn.parentNode) {
            btn.parentNode.insertBefore(sentinel, btn);
        }

        var observer = new IntersectionObserver(function (entries) {
            var entry = entries[0];
            // If sentinel goes top-out of the root margin, button is sticky
            if (!entry.isIntersecting && entry.boundingClientRect.top < 50) {
                btn.classList.add('is-sticky');
            } else {
                btn.classList.remove('is-sticky');
            }
        }, {rootMargin: '-50px 0px 0px 0px', threshold: 0});

        observer.observe(sentinel);
    });
</script>
